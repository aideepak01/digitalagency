name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # CI runs, verifies the build works. If it passes, push succeeds and
  # Hostinger's webhook automatically pulls and deploys.
  # No manual deploy step needed — Hostinger handles it.
  notify:
    name: Notify Hostinger (webhook auto-deploys)
    runs-on: ubuntu-latest
    needs: []
    if: always()

    steps:
      - name: Ready for Hostinger auto-deploy
        run: echo "CI passed. Hostinger webhook will auto-deploy on push to main."
